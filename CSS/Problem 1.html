<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{ 
            margin: 0px;  
        }
        section{
            background-color: rgb(37, 70, 141);
            padding : 15px 5% 0px 5%;
            height: 110px;
            vertical-align: top;
        }
        .logo{
            float : left;
        }
        .menu{
            width: 70%;
            position: relative;
            padding-top: 10px;
            float : right;
            font-size: 20px;
        }
        .menu_items_lower{
            float: right;
        }
        .menu_items_upper{
            float: right;
            padding-bottom: 10px;
        }
        
        .dropbtn{
            border: none;
            background-color: rgba(0, 0, 0, 0);
            cursor: pointer;
            font-size: 18px;
            padding: 0px;
        }
        .dropdown{
            margin-top: 4px;
            position: relative;
            display: inline-block;
            vertical-align: bottom;
        }
        .dropdown-content{
            padding-top: 8px;
            display: none;
            position: absolute;
            background-color: white;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
            margin : 0px 0px 0px 0px;
        }
        .dropdown-content a{
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }
        .dropdown:hover .dropdown-content{
            display: block;
        }
        .item{
            text-decoration: none;
            margin-left: 40px;
            color: white;
        }

        .search_form{
            box-sizing: border-box;
            padding: 0px 10px;
            margin-top: 0px;
        }

        .search_form input[type=text]{
            padding: 5px;
            font-size: 17px;
            border: 1px solid grey;
            float: right;
            width: 75%;
            background: #f1f1f1;
            border-radius: 9px 0px 0px 9px;            
        }
        .search_form button{
            float: right;
            width: 20%;
            padding: 5px;
            background: #cfcfcf;
            color: rgb(90, 90, 90);
            font-size: 17px;
            border: 1px solid grey;
            border-left: none; 
            cursor: pointer;
            border-radius: 0px 9px 9px 0px;      
        }

        .search_form::after{
            content: "";
            clear: both;
            display: table;
        }
        .arrow {
            display: inline-block;
            width : 0;
            height : 0;
            margin-bottom: 2px;
            border-left: 5.5px solid transparent;
            border-right: 5.5px solid transparent;
            border-top: 8px solid #ffffff;
        }
        .bell{
            float : left;
            margin-top: 4px;
        }

    </style>
</head>
<body>
    <div class = "whatever"></div>
    <section>
        <div class="header"> 

            <div class = "logo">
                <a href = "https://antra.com/#" target = "_blank"> <img src="AntraLogo.png" alt="antra">  </a>
            </div>
            <div class = "menu">
                <div class = "menu_items_upper">
                    <div class = "bell"> 
                        <a class = "item" href = "https://antra.com/#" target = "_blank">0
                            <i class="fa fa-bell" style="color: white;"> </i></a>
                    </div>
                    <div class = "dropdown">
                        <button class = "dropbtn item">USER <div class="arrow"></div></button>
                        <div class = "dropdown-content item">
                            <a href = "#">PROFILE</a>
                            <a href = "#">LOGOUT</a>
                        </div>
                    </div>
                    <form class="search_form menu_items_upper" action = "#">
                        <button type = "submit" class = "search_btn"><i class = "fa fa-search"></i></button>
                        <input type = "text" class = "search_input" placeholder = "Search..." id="search" name="search">
                    </form>
                </div>
                <br>
                <div class = "menu_items_lower">                    
                    <a class = "item" href = "https://antra.com/#" target = "_blank">NEWS</a>
                    <div class = "dropdown">
                        <button class = "dropbtn item">ABOUT THE UNIVERSITY <div class="arrow"></div></button>
                        <div class = "dropdown-content item">
                            <a href = "#">FALCUTIES</a>
                            <a href = "#">DEPARTMENTS</a>
                        </div>
                    </div>
                    <div class = "dropdown">
                        <button class = "dropbtn item">TRAINING COURSES <div class="arrow"></div></button>
                        <div class = "dropdown-content item">
                            <a href = "#">FULL STACK DEVELOPMENT</a>
                            <a href = "#">DATA SCIENCE</a>
                        </div>
                    </div>
                    <a class = "item" href = "https://antra.com/#" target = "_blank">FOR COMPANIES</a>
                    <a class = "item" href = "https://antra.com/#" target = "_blank">FORUM</a>
                    <a class = "item" href = "https://antra.com/#" target = "_blank">CONTACTS</a>
                </div>
            </div>            
        </div>
    </section>
</body>
</html>
